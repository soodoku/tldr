name: Formatting

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.yml"
      - "**/*.yaml"
      - ".pre-commit-config.yaml"
  push:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.yml"
      - "**/*.yaml"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check formatting
        run: npx --yes prettier@3.9.6 --check .
