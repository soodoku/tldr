repos:
  - repo: local
    hooks:
      - id: prepare_images
        name: Prepare images
        entry: scripts/prepare_images.sh --fix
        language: system
        files: (?i)^src/.*\.(gif|jpe?g|png|tiff?|webp)$
      - id: prettier
        name: Prettier
        entry: npx --yes prettier@3.9.6 --write --ignore-unknown
        language: system
        files: \.(markdown|md|ya?ml)$
        require_serial: true
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        args: [--offline, --include-fragments, --no-progress]
        types_or: [markdown, html]
